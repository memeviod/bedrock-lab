name: Build Bedrock Lab APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack Android source
        run: unzip bedrock-lab-android-source.zip -d android-source
      - name: Build installable release APK
        working-directory: android-source/android
        run: gradle --no-daemon assembleRelease
      - name: Upload direct APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android-source/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Lab-APK
          path: android-source/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
